# Builds the website (GitHub Pages) with fresh real data and publishes it.
# The build job takes ~4-5 minutes. As soon as it finishes, the `next` job starts the next build while this one is
# still publishing, so prices (data/quotes.json) refresh about every 5 minutes. Prices never wait for Gemini: they
# are collected first, kept updating while the pages are written, and written again as the build's last step.
# Only one build job and one publish job run at a time (job-level concurrency groups below).
# The schedule is only a backup in case the chain stops.
name: Build website

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Backup only, twice an hour: if the chain ever stops, prices are stale for at most ~30 min (plus GitHub's delay).
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: website-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore the database from the previous build
        uses: actions/cache/restore@v6
        with:
          path: site_db
          key: site-db-${{ github.run_id }}
          restore-keys: site-db-

      - name: Build the site
        env:
          # Add these in: repository Settings -> Secrets and variables -> Actions -> New repository secret
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Optional repository variables (same page, "Variables" tab)
          GEMINI_MODEL_FAST: ${{ vars.GEMINI_MODEL_FAST || 'gemini-3.5-flash-lite' }}
          GEMINI_MODEL_SMART: ${{ vars.GEMINI_MODEL_SMART || 'gemini-3.6-flash' }}
          GEMINI_DAILY_CALL_LIMIT: ${{ vars.SITE_GEMINI_DAILY_LIMIT || '150' }}
          SITE_AI_TASKS_PER_RUN: ${{ vars.SITE_AI_TASKS_PER_RUN || '2' }}
          MLW_NO_DOTENV: "1"
          DATABASE_PATH: site_db/markets.db
          LOG_DIR: site_db/logs
        run: python build_site.py --out _site --base "/${{ github.event.repository.name }}"

      - name: Save the database for the next build
        if: always()
        uses: actions/cache/save@v6
        with:
          path: site_db
          key: site-db-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Publishing is its own job and is retried. Right after an upload, GitHub's artifact list can lag for a few
  # seconds; when deploy-pages ran in the same job ~0.3 s after the upload, about 1 build in 4 failed with
  # 'No artifacts named "github-pages" were found for this workflow run' (Nov 2026: 40 failed builds, all this).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - name: Wait until GitHub lists the uploaded site
        env:
          GH_TOKEN: ${{ github.token }}
          LIST_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "$LIST_URL" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "the site artifact is listed"; exit 0; fi
            echo "not listed yet (check $i of 24), waiting 5 s"
            sleep 5
          done
          echo "still not listed after 2 minutes; trying to publish anyway"

      - name: Publish (try 1)
        id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before trying again
        if: steps.try1.outcome == 'failure'
        run: sleep 30

      - name: Publish (try 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait longer before the last try
        if: steps.try2.outcome == 'failure'
        run: sleep 90

      - name: Publish (try 3, a failure here fails the run)
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5

  next:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start the next build now (only one chain at a time)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A build that failed fast (e.g. a pip outage) should not start a tight loop of failing builds.
          if [ "${{ needs.build.result }}" != "success" ]; then sleep 240; fi
          # Nov 2026: one GitHub API hiccup here (exit 1 after 7 s) stopped the 5-minute chain until the backup
          # cron. Every API call is now retried; only a dispatch that keeps failing for ~4 minutes fails the run.
          retry() {
            local i
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              echo "::warning::'$1 $2 $3' failed (try $i of 6), waiting $((i * 10)) s"
              sleep $((i * 10))
            done
            return 1
          }
          # Older runs that are only finishing their publish job don't count; a waiting run or a newer running one
          # (e.g. a push or the hourly backup) already continues the chain.
          count_others() {
            others=$(gh run list -R "$REPO" --workflow site.yml --limit 30 --json databaseId,status \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\" or (.status==\"in_progress\" and .databaseId > ${{ github.run_id }}))] | length")
          }
          others=""
          if ! retry count_others; then
            echo "::warning::could not list the other builds; starting the next one anyway (a duplicate only waits its turn)"
            others=0
          fi
          if [ "${others:-0}" = "0" ]; then
            retry gh workflow run site.yml -R "$REPO" --ref main
            echo "next build started"
          else
            echo "another build is already waiting or running ($others); it continues the chain"
          fi
